name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lean gate: ruff + the dead-code test only. Deliberately skips the full
  # pytest suite so CI never installs torch/sentence-transformers (~minutes,
  # heavy). The dead-code test is pure stdlib AST analysis, so it runs in an
  # ephemeral env with no project sync. Run the full suite locally.
  lint:
    name: Lint & dead code
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8
        with:
          version: "0.11.3"

      - name: Ruff lint
        run: uvx ruff@0.15.12 check .

      - name: Ruff format check
        run: uvx ruff@0.15.12 format --check .

      - name: Dead-code gate
        run: uv run --no-project --with pytest --python 3.12 python -m pytest -q tests/test_dead_code.py
