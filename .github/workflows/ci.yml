name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-commits:
    name: Release commit categories
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test commit category validator
        run: node --test scripts/release-commits.test.cjs
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { invalidCommits, commitsForEvent } = require('./scripts/release-commits.cjs');
            const commits = await commitsForEvent(context, github);
            const invalid = invalidCommits(commits);
            if (invalid.length) {
              core.setFailed(`${invalid.length} non-merge commit(s) need Conventional Commit subjects. See docs/project/GIT_HISTORY_POLICY.md.`);
            }

  # Lean gate: ruff + the dead-code test only. Deliberately skips the full
  # pytest suite so CI never installs torch/sentence-transformers (~minutes,
  # heavy). The dead-code test is pure stdlib AST analysis, so it runs in an
  # ephemeral env with no project sync. Run the full suite locally.
  lint:
    name: Lint & dead code
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v8
        with:
          version: "0.11.3"

      - name: Ruff lint
        run: uvx ruff@0.15.12 check .

      - name: Ruff format check
        run: uvx ruff@0.15.12 format --check .

      - name: Dead-code gate
        run: uv run --no-project --with pytest --python 3.12 python -m pytest -q tests/test_dead_code.py
