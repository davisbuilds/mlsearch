[project]
name = "mlsearch"
version = "0.1.0"
description = "Local-first semantic paper search over arXiv cs.LG"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "davisbuilds" },
]
dependencies = [
    "numpy==2.4.6",
    "pyyaml==6.0.3",
    "sentence-transformers==5.6.1",
    "torch==2.13.0",
]

[project.scripts]
mlsearch = "mlsearch.cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C4", "SIM", "ERA", "RUF", "PIE"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures embed long realistic data (arXiv XML feeds, paper titles, query
# strings) that must stay byte-accurate; wrapping them would corrupt the fixture.
"tests/**" = ["E501"]

[tool.uv]
default-groups = ["dev"]
